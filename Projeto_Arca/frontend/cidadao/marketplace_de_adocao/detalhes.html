                <img class="arca-logo-img" src="../../assets/img/arca-logo.png" alt="Programa Arca">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="arcaNav">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                    <li class="nav-item"><a class="nav-link" href="./index.html"><i class="bi bi-search"></i><span>Candidato</span></a></li>
                    <li class="nav-item"><a class="nav-link" href="./favoritos.html"><i class="bi bi-heart"></i><span>Favoritos</span><span class="favorite-count badge rounded-pill">0</span></a></li>
                    <li class="nav-item"><a class="nav-link nav-link-soft" href="../index.html"><i class="bi bi-person"></i><span>Tutor</span></a></li>

    <main id="detailRoot" class="detail-page" data-entity="animal_profile" data-endpoint="/api/animals/{id}">
        <div class="container-fluid px-lg-4">
            <div id="detailContent"></div>
        </div>
    </main>

    <div class="modal fade" id="adoptionModal" tabindex="-1" aria-labelledby="adoptionModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <form class="modal-content arca-modal" id="adoptionForm" data-entity="adoption_interest" data-endpoint="/api/adoption-interests">
                <div class="modal-header">
                    <div>
                        <p class="section-kicker mb-1">Solicitação</p>
                        <h2 class="modal-title h5 fw-bold" id="adoptionModalLabel">Quero adotar</h2>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label" for="adopterName">Nome completo</label>
                            <input class="form-control" id="adopterName" type="text" required placeholder="Seu nome">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="adopterPhone">Telefone</label>
                            <input class="form-control" id="adopterPhone" type="tel" required placeholder="(00) 00000-0000">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="homeType">Moradia</label>
                            <select class="form-select" id="homeType" required>
                                <option value="">Selecione</option>
                                <option>Casa</option>
                                <option>Apartamento</option>
                                <option>Chácara</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="adoptionNote">Conte um pouco sobre a rotina</label>
                            <textarea class="form-control" id="adoptionNote" rows="3" placeholder="Horários, família, outros animais..."></textarea>
                        </div>
                    </div>
                    <div id="adoptionFeedback" class="alert alert-success rounded-1 mt-3 d-none" role="status">
                        Solicitação registrada. A ONG entra em contato para combinar a entrevista.
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-primary rounded-1" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary rounded-1">Enviar interesse</button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="arcaToast" class="toast arca-toast" role="status" aria-live="polite" aria-atomic="true">
            <div class="toast-body"></div>
        </div>
    </div>

    <script src="./marketplace.js"></script>
</body>
</html>
